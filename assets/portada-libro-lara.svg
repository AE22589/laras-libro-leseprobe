<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1680 1840" role="img" aria-labelledby="title description">
  <title id="title">Lara y el secreto de la melodía de las sombras</title>
  <desc id="description">Portada ilustrada de Lara, Anne, Anne de Alemania y Lokum en la ciudad musical de Sonoria. Una aventura de Lara, Anne, Anne de Alemania y Lokum.</desc>
  <defs>
    <linearGradient id="night" x2="0" y2="1">
      <stop stop-color="#10175d"/>
      <stop offset=".52" stop-color="#242b83"/>
      <stop offset="1" stop-color="#303489"/>
    </linearGradient>
    <linearGradient id="stage" x2="0" y2="1">
      <stop stop-color="#292b84"/>
      <stop offset=".42" stop-color="#40317f"/>
      <stop offset="1" stop-color="#261c63"/>
    </linearGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#fff1bd"/>
      <stop offset=".45" stop-color="#f4d47e"/>
      <stop offset="1" stop-color="#dfa94f"/>
    </linearGradient>
    <linearGradient id="topFade" x2="0" y2="1">
      <stop stop-color="#17216b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#252c84" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x2="0" y2="1">
      <stop stop-color="#2a2d86" stop-opacity="0"/>
      <stop offset="1" stop-color="#30205e" stop-opacity=".86"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 .48  0 1 0 0 .34  0 0 1 0 .08  0 0 0 .65 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="atmosphere"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="1680" height="1840" fill="url(#night)"/>
  <image x="0" y="0" width="1680" height="1840" preserveAspectRatio="none" opacity=".12" filter="url(#atmosphere)" xlink:href="portada-sonoria-v4-grafica.png"/>
  <rect width="1680" height="430" fill="url(#night)" opacity=".9"/>


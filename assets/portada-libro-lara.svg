    <text x="840" y="1670" fill="#fff3d5" stroke="#302053" stroke-opacity=".6" stroke-width="2" paint-order="stroke" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing=".5">Anne de Alemania y Lokum</text>
